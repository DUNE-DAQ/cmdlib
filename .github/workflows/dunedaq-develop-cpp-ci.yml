name: build-develop

on:
  push:
    branches: 
      - develop
      - patch/*
      - prep-release/*
    paths-ignore:
      - 'docs/**'
      - '.github/**'
  pull_request:
    branches:
      - develop
      - patch/*
      - prep-release/*

  schedule:
    - cron: "0 9 * * *"

  workflow_dispatch:

jobs:
  build_develop_dispatch:
    name: Build against the development release
    uses: DUNE-DAQ/.github/.github/workflows/dunedaq-develop-cpp-ci.yml@amogan/single_package_linting
    with:
      caller_event_name: ${{ github.event_name }}